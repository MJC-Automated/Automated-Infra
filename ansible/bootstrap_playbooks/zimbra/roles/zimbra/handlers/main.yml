---
- name: Restart Zimbra MTA
  ansible.builtin.command:
    argv:
      - su
      - "-"
      - zimbra
      - -c
      - zmmtactl restart
  changed_when: true

- name: Restart Zimbra services
  ansible.builtin.command:
    argv:
      - su
      - "-"
      - zimbra
      - -c
      - zmcontrol restart
  changed_when: true
