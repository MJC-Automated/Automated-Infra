---
- name: Ensure keycloak systemd environment directory exists
  ansible.builtin.file:
    path: /etc/keycloak
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Render Keycloak runtime environment file
  ansible.builtin.template:
    src: keycloak.env.j2
    dest: /etc/keycloak/keycloak.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart keycloak
  no_log: true

- name: Install Keycloak systemd service
  ansible.builtin.template:
    src: keycloak.service.j2
    dest: /etc/systemd/system/keycloak.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart keycloak

- name: Flush handlers before starting service
  ansible.builtin.meta: flush_handlers

- name: Ensure keycloak service is enabled and running
  ansible.builtin.systemd:
    name: keycloak
    enabled: true
    state: started

- name: Gather firewall service facts
  ansible.builtin.service_facts:
  when: keycloak_manage_firewall | bool

- name: Preserve OpenSSH access before enabling UFW
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: keycloak_manage_firewall | bool

- name: Open Keycloak firewall ports in UFW
  community.general.ufw:
    rule: allow
    to_port: "{{ item | string }}"
    proto: tcp
  loop:
    - "{{ keycloak_http_port }}"
    - "{{ keycloak_health_port }}"
  when: keycloak_manage_firewall | bool

- name: Stop and disable firewalld before enabling UFW
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
  when:
    - keycloak_manage_firewall | bool
    - "'firewalld.service' in ansible_facts.services"

- name: Enable UFW after the Keycloak ingress contract is staged
  community.general.ufw:
    state: enabled
  when: keycloak_manage_firewall | bool
