---
- name: Install dependencies
  ansible.builtin.apt:
    name:
      - curl
      - openssh-server
      - ca-certificates
      - tzdata
      - perl
      - gnupg
    state: present
    update_cache: true
  register: gitlab_dependency_install
  until: gitlab_dependency_install is succeeded
  retries: 3
  delay: 10

- name: Query installed GitLab package version before repository upgrade
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${Version}
      - "{{ gitlab_edition }}"
  register: gitlab_installed_version
  changed_when: false
  failed_when: false

- name: Check whether selected GitLab target is after the required stop
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ gitlab_version }}"
      - gt
      - "{{ gitlab_required_upgrade_stop_version }}"
  register: gitlab_target_after_required_stop
  changed_when: false
  failed_when: false

- name: Check whether installed GitLab is before the required stop
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ gitlab_installed_version.stdout | trim }}"
      - lt
      - "{{ gitlab_required_upgrade_stop_version }}"
  register: gitlab_installed_before_required_stop
  changed_when: false
  failed_when: false
  when:
    - gitlab_installed_version.rc == 0
    - gitlab_target_after_required_stop.rc == 0

- name: Block GitLab upgrades that skip the required 19.2 stop
  ansible.builtin.assert:
    that:
      - gitlab_installed_before_required_stop.rc != 0
    fail_msg: >-
      Installed {{ gitlab_edition }} {{ gitlab_installed_version.stdout | trim }}
      must first upgrade to {{ gitlab_required_upgrade_stop_version }} before
      {{ gitlab_version }}. Run with -e gitlab_version={{ gitlab_required_upgrade_stop_version }}
      (or update GITLAB_VERSION in .env), wait for all GitLab background
      migrations to finish, back up again, then rerun with
      -e gitlab_version={{ gitlab_version }}. Use a matching local package or
      clear gitlab_package_path to use the repository at each stop.
  when:
    - gitlab_installed_version.rc == 0
    - gitlab_target_after_required_stop.rc == 0
    - gitlab_installed_before_required_stop.rc == 0

- name: Check local GitLab package on controller
  ansible.builtin.stat:
    path: "{{ gitlab_package_path }}"
  delegate_to: localhost
  become: false
  register: gitlab_local_package
  when: gitlab_package_path | length > 0

- name: Assert configured local GitLab package exists
  ansible.builtin.assert:
    that:
      - gitlab_local_package.stat.exists
      - gitlab_local_package.stat.isreg
    fail_msg: "GitLab package {{ gitlab_package_path }} was not found on the controller."
  when: gitlab_package_path | length > 0

- name: Copy local GitLab package to target
  ansible.builtin.copy:
    src: "{{ gitlab_package_path }}"
    dest: "/tmp/{{ gitlab_package_path | basename }}"
    mode: "0644"
  when: gitlab_package_path | length > 0

- name: Read local GitLab package version
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - --field
      - "/tmp/{{ gitlab_package_path | basename }}"
      - Version
  register: gitlab_local_package_version
  changed_when: false
  when: gitlab_package_path | length > 0

- name: Require local GitLab package to match the configured version
  ansible.builtin.assert:
    that:
      - gitlab_local_package_version.stdout | trim == gitlab_version
    fail_msg: >-
      Local GitLab package version {{ gitlab_local_package_version.stdout | trim }}
      does not match configured gitlab_version {{ gitlab_version }}. Update
      both values together and preserve the required GitLab upgrade stops.
  when: gitlab_package_path | length > 0

- name: Install GitLab from local package
  ansible.builtin.apt:
    deb: "/tmp/{{ gitlab_package_path | basename }}"
    state: present
  register: gitlab_local_package_install
  until: gitlab_local_package_install is succeeded
  retries: 3
  delay: 10
  when: gitlab_package_path | length > 0

- name: Check whether the GitLab repository is configured
  ansible.builtin.stat:
    path: "/etc/apt/sources.list.d/gitlab_{{ gitlab_edition }}.list"
  register: gitlab_repository_source
  when: gitlab_package_path | length == 0

- name: Download GitLab repository installation script
  ansible.builtin.get_url:
    url: "https://packages.gitlab.com/install/repositories/gitlab/{{ gitlab_edition }}/script.deb.sh"
    dest: /tmp/gitlab_install_repo.sh
    mode: "0755"
  register: gitlab_repository_script_download
  until: gitlab_repository_script_download is succeeded
  retries: 3
  delay: 10
  when:
    - gitlab_package_path | length == 0
    - not gitlab_repository_source.stat.exists

- name: Run GitLab repository installation script
  ansible.builtin.command: /tmp/gitlab_install_repo.sh
  args:
    creates: "/etc/apt/sources.list.d/gitlab_{{ gitlab_edition }}.list"
  when:
    - gitlab_package_path | length == 0
    - not gitlab_repository_source.stat.exists

- name: Install GitLab CE package
  ansible.builtin.apt:
    name: "{{ gitlab_edition }}{{ '=' + gitlab_version if gitlab_version != '' else '' }}"
    state: present
    update_cache: true
  register: gitlab_package_install
  until: gitlab_package_install is succeeded
  retries: 3
  delay: 10
  when: gitlab_package_path | length == 0
