---
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
    state: present
    update_cache: true
  register: gitlab_runner_docker_prereq_install
  until: gitlab_runner_docker_prereq_install is succeeded
  retries: 3
  delay: 10
  when: gitlab_runner_install_docker | bool

- name: Ensure Docker apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Download Docker repository key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Install Docker apt helper packages
  ansible.builtin.apt:
    name:
      - python3-debian
    state: present
    update_cache: true
  register: gitlab_runner_docker_deb822_helper_install
  until: gitlab_runner_docker_deb822_helper_install is succeeded
  retries: 3
  delay: 10
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Add Docker repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Remove legacy Docker apt_repository list file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Install Docker packages from Docker repository
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    update_cache: true
  register: gitlab_runner_docker_repo_install
  until: gitlab_runner_docker_repo_install is succeeded
  retries: 3
  delay: 10
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'docker'

- name: Install Docker packages from Ubuntu repository
  ansible.builtin.apt:
    name:
      - docker.io
    state: present
    update_cache: true
  register: gitlab_runner_docker_ubuntu_install
  until: gitlab_runner_docker_ubuntu_install is succeeded
  retries: 3
  delay: 10
  when:
    - gitlab_runner_install_docker | bool
    - gitlab_runner_docker_package_source == 'ubuntu'

- name: Ensure Docker is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  when: gitlab_runner_install_docker | bool

- name: Require both gitlab-runner and helper-images packages for offline installation
  ansible.builtin.assert:
    that:
      - gitlab_runner_package_path | length > 0
      - gitlab_runner_helper_images_package_path | length > 0
    fail_msg: >-
      GitLab Runner offline installation requires both gitlab_runner_package_path
      and gitlab_runner_helper_images_package_path to satisfy strict version dependencies.
  when: (gitlab_runner_package_path | length > 0) or (gitlab_runner_helper_images_package_path | length > 0)

- name: Check local GitLab Runner packages on controller
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: gitlab_runner_local_packages
  loop:
    - { name: "gitlab-runner", path: "{{ gitlab_runner_package_path }}", checksum: "{{ gitlab_runner_package_checksum }}" }
    - { name: "gitlab-runner-helper-images", path: "{{ gitlab_runner_helper_images_package_path }}", checksum: "{{ gitlab_runner_helper_images_package_checksum }}" }
  when: gitlab_runner_package_path | length > 0

- name: Assert configured local GitLab Runner packages exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
    fail_msg: "Local package {{ item.item.path }} for {{ item.item.name }} was not found on the controller."
  loop: "{{ gitlab_runner_local_packages.results }}"
  when: gitlab_runner_package_path | length > 0

- name: Require checksums for offline GitLab Runner packages
  ansible.builtin.assert:
    that:
      - gitlab_runner_package_checksum | length > 0
      - gitlab_runner_helper_images_package_checksum | length > 0
    fail_msg: >-
      Offline installation requires SHA256 checksums for both packages.
      Set gitlab_runner_package_checksum and gitlab_runner_helper_images_package_checksum
      in your .env file or role variables.
  when: gitlab_runner_package_path | length > 0

- name: Assert local GitLab Runner package checksums match
  ansible.builtin.assert:
    that:
      - item.stat.checksum == item.item.checksum
    fail_msg: "Checksum mismatch for {{ item.item.name }}: expected {{ item.item.checksum }}, found {{ item.stat.checksum }}"
  loop: "{{ gitlab_runner_local_packages.results }}"
  when: gitlab_runner_package_path | length > 0

- name: Copy local GitLab Runner packages to target
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "/tmp/{{ item.path | basename }}"
    mode: "0644"
  loop:
    - { path: "{{ gitlab_runner_package_path }}" }
    - { path: "{{ gitlab_runner_helper_images_package_path }}" }
  when: gitlab_runner_package_path | length > 0

- name: Read local GitLab Runner package versions
  ansible.builtin.command:
    argv:
      - dpkg-deb
      - --field
      - "/tmp/{{ item | basename }}"
      - Version
  register: gitlab_runner_bundle_versions
  changed_when: false
  loop:
    - "{{ gitlab_runner_package_path }}"
    - "{{ gitlab_runner_helper_images_package_path }}"
  when: gitlab_runner_package_path | length > 0

- name: Require local GitLab Runner package versions to match configured version and each other
  ansible.builtin.assert:
    that:
      - gitlab_runner_bundle_versions.results[0].stdout | trim == gitlab_runner_version
      - gitlab_runner_bundle_versions.results[1].stdout | trim == gitlab_runner_version
      - gitlab_runner_bundle_versions.results[0].stdout | trim == gitlab_runner_bundle_versions.results[1].stdout | trim
    fail_msg: >-
      GitLab Runner offline bundle version mismatch:
      runner={{ gitlab_runner_bundle_versions.results[0].stdout | trim }},
      helper-images={{ gitlab_runner_bundle_versions.results[1].stdout | trim }},
      configured={{ gitlab_runner_version }}.
  when: gitlab_runner_package_path | length > 0

- name: Install GitLab Runner offline package bundle
  ansible.builtin.apt:
    deb: "/tmp/{{ item | basename }}"
    state: present
  register: gitlab_runner_local_bundle_install
  until: gitlab_runner_local_bundle_install is succeeded
  retries: 3
  delay: 10
  loop:
    - "{{ gitlab_runner_helper_images_package_path }}"
    - "{{ gitlab_runner_package_path }}"
  when: gitlab_runner_package_path | length > 0

- name: Check whether the GitLab Runner repository is configured
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/runner_gitlab-runner.list
  register: gitlab_runner_repository_source
  when: gitlab_runner_package_path | length == 0

- name: Add gitlab-runner repository script
  ansible.builtin.get_url:
    url: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh
    dest: /tmp/gitlab_runner_install.sh
    mode: "0755"
  register: gitlab_runner_repository_script_download
  until: gitlab_runner_repository_script_download is succeeded
  retries: 3
  delay: 10
  when:
    - gitlab_runner_package_path | length == 0
    - not gitlab_runner_repository_source.stat.exists

- name: Run gitlab-runner repository script
  ansible.builtin.command: /tmp/gitlab_runner_install.sh
  args:
    creates: /etc/apt/sources.list.d/runner_gitlab-runner.list
  when:
    - gitlab_runner_package_path | length == 0
    - not gitlab_runner_repository_source.stat.exists

- name: Install gitlab-runner package
  ansible.builtin.apt:
    name:
      - "gitlab-runner={{ gitlab_runner_version }}"
      - "gitlab-runner-helper-images={{ gitlab_runner_version }}"
    state: present
    update_cache: true
  register: gitlab_runner_package_install
  until: gitlab_runner_package_install is succeeded
  retries: 3
  delay: 10
  when: gitlab_runner_package_path | length == 0

- name: Add gitlab-runner user to docker group
  ansible.builtin.user:
    name: gitlab-runner
    groups: docker
    append: true
  when: gitlab_runner_install_docker | bool

- name: Write GitLab Runner registration template
  ansible.builtin.template:
    src: runner-template.toml.j2
    dest: "{{ gitlab_runner_template_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Set GitLab Runner global concurrency
  ansible.builtin.lineinfile:
    path: /etc/gitlab-runner/config.toml
    regexp: "^concurrent\\s*="
    line: "concurrent = {{ gitlab_runner_concurrent }}"
    create: true
    owner: root
    group: root
    mode: "0600"

- name: Check if runner is already registered
  ansible.builtin.shell: |
    if [ -f /etc/gitlab-runner/config.toml ] && grep -q 'name = "{{ gitlab_runner_name }}"' /etc/gitlab-runner/config.toml && grep -q 'url = "{{ gitlab_external_url }}/"' /etc/gitlab-runner/config.toml; then
      echo "ALREADY_REGISTERED"
    else
      echo "NOT_REGISTERED"
    fi
  register: runner_check_status
  changed_when: false

- name: Register runner with GitLab Server
  when: runner_check_status.stdout == "NOT_REGISTERED"
  block:
    - name: Wait for the GitLab API to become ready
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/version"
        method: GET
        # Accept 200 (authenticated) or 401 (unauthenticated but API reachable).
        # /-/health is restricted to monitoring_whitelist IPs by default and
        # returns 404 to external callers even when GitLab is fully up.
        status_code: [200, 401]
      register: gitlab_api_health
      until: gitlab_api_health.status in [200, 401]
      retries: 60
      delay: 5
      changed_when: false

    - name: Create runner instance in GitLab via API
      ansible.builtin.uri:
        url: "{{ gitlab_external_url }}/api/v4/user/runners"
        method: POST
        headers:
          PRIVATE-TOKEN: "{{ gitlab_api_token }}"
        body_format: json
        body:
          runner_type: "instance_type"
          description: "{{ gitlab_runner_name }}"
          tag_list: "{{ gitlab_runner_tags }}"
          run_untagged: "{{ gitlab_runner_run_untagged | bool }}"
          locked: "{{ gitlab_runner_locked | bool }}"
          paused: "{{ gitlab_runner_paused | bool }}"
          access_level: "{{ gitlab_runner_access_level }}"
          maximum_timeout: "{{ gitlab_runner_maximum_timeout }}"
        status_code: 201
      register: created_runner_response
      until: created_runner_response.status == 201
      retries: 5
      delay: 5
      no_log: true

    - name: Run gitlab-runner register command
      ansible.builtin.command: >
        gitlab-runner register
        --non-interactive
        --url "{{ gitlab_external_url }}/"
        --token "{{ created_runner_response.json.token }}"
        --template-config "{{ gitlab_runner_template_path }}"
        --executor "{{ gitlab_runner_executor }}"
        --docker-image "{{ gitlab_runner_docker_image }}"
        --description "{{ gitlab_runner_name }}"
      register: register_output
      changed_when: true
      no_log: true

    - name: Restart gitlab-runner service after registration
      ansible.builtin.systemd:
        name: gitlab-runner
        state: restarted
        enabled: true

- name: Ensure gitlab-runner service is enabled and started
  ansible.builtin.systemd:
    name: gitlab-runner
    state: started
    enabled: true

- name: Verify GitLab Runner daemon connectivity and registration
  ansible.builtin.command:
    argv:
      - gitlab-runner
      - verify
  register: runner_verify_status
  changed_when: false
  when:
    - not ansible_check_mode
    - runner_check_status.stdout == "ALREADY_REGISTERED" or (register_output is defined and register_output is succeeded)

- name: Report GitLab Runner verification status
  ansible.builtin.debug:
    msg: "GitLab Runner daemon is active and verified with GitLab coordinator: {{ gitlab_runner_name }}"
  when:
    - not ansible_check_mode
    - runner_verify_status is defined
    - runner_verify_status is succeeded
