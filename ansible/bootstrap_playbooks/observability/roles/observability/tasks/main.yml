---
- name: Materialize kube-state-metrics kubeconfig when managed
  ansible.builtin.import_tasks: kube-state-metrics.yml
  tags: [observability, kube_state_metrics]

- name: Validate input variables
  ansible.builtin.import_tasks: validate.yml

- name: Install package prerequisites
  ansible.builtin.import_tasks: packages.yml

- name: Render stack configuration
  ansible.builtin.import_tasks: configure.yml

- name: Start observability stack
  ansible.builtin.import_tasks: service.yml

- name: Verify observability endpoints
  ansible.builtin.import_tasks: verify.yml

- name: Reconcile Grafana library panels
  ansible.builtin.import_tasks: grafana-library.yml
