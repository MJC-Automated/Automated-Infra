---
# Core
zabbix_version: "7.0"

# Database mode: internal (local PostgreSQL on Zabbix host) or external (remote PostgreSQL)
zabbix_db_mode: internal
zabbix_db_host: "127.0.0.1"
zabbix_db_port: 5432
zabbix_db_name: zabbix
zabbix_db_user: zabbix
zabbix_db_password: ""
zabbix_required_password_length: 20
zabbix_generate_local_passwords: true
zabbix_db_password_path: "{{ playbook_dir }}/files/zabbix_db_password"
zabbix_api_password_path: "{{ playbook_dir }}/files/zabbix_api_password"
zabbix_local_secret_owner: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"
zabbix_local_secret_group: "{{ lookup('pipe', 'id -gn ' ~ zabbix_local_secret_owner) }}"
zabbix_db_schema: ""
zabbix_db_credentials_store: plaintext
zabbix_db_vault_url: "https://localhost:8200"
zabbix_db_vault_prefix: ""
zabbix_db_vault_db_path: ""
zabbix_db_vault_token: ""
zabbix_db_vault_cache: false

# Credentials for optional DB bootstrap when zabbix_db_manage_user_and_db=true
zabbix_db_admin_user: postgres
zabbix_db_admin_password: ""
zabbix_db_manage_user_and_db: true

# Import /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz when dbversion table is absent
zabbix_db_import_schema: true

# Optional extras
zabbix_manage_agent2_plugins: false
zabbix_manage_firewall: false
zabbix_oracle_exclude_epel_zabbix: true
zabbix_service_enable: true
zabbix_service_start: true
zabbix_php_timezone: "UTC"
zabbix_frontend_server_name: ""
zabbix_allow_http_cidr: "0.0.0.0/0"
zabbix_allow_server_port_cidr: "0.0.0.0/0"
zabbix_agent_source_cidr: "127.0.0.1"
zabbix_server_port: 10051
zabbix_agent_port: 10050
zabbix_java_gateway_enabled: true
zabbix_java_gateway_host: 127.0.0.1
zabbix_java_gateway_port: 10052
zabbix_java_pollers: 5
# The reporting service and pinned browser package path are Ubuntu-only.
# Keep default runs supported on Oracle Linux while preserving the existing
# Ubuntu behavior; environments may still override this explicitly.
zabbix_reporting_enabled: >-
  {{ ansible_facts.distribution | default('') == 'Ubuntu' }}
zabbix_web_service_host: 127.0.0.1
zabbix_web_service_port: 10053
zabbix_report_writers: 1
zabbix_reporting_chrome_version: "151.0.7922.34"
zabbix_reporting_chrome_archive: >-
  chrome-for-testing-{{ zabbix_reporting_chrome_version }}-linux64.zip
zabbix_reporting_chrome_sha256: "ae8736ac28bc69278551500f219fc749575648263c43ec5990749eff43b9fcf8"
zabbix_reporting_resource_dir: /resources
zabbix_reporting_install_dir: "/opt/zabbix-reporting/{{ zabbix_reporting_chrome_version }}"
zabbix_reporting_chrome_binary: "{{ zabbix_reporting_install_dir }}/chrome-linux64/chrome"
zabbix_scheduled_reports_enabled: false
zabbix_scheduled_report_name_prefix: "IaC "
# Each entry is reconciled through report.create/report.update after the
# dashboard and recipient are resolved by name. Keep IDs out of source so
# dashboard recreation does not silently retarget a report.
zabbix_scheduled_reports: []
zabbix_reporting_browser_packages:
  - unzip
  - fonts-liberation
  - libasound2t64
  - libatk-bridge2.0-0t64
  - libatk1.0-0t64
  - libcairo2
  - libcups2t64
  - libdbus-1-3
  - libexpat1
  - libfontconfig1
  - libgbm1
  - libglib2.0-0t64
  - libgtk-3-0t64
  - libnspr4
  - libnss3
  - libpango-1.0-0
  - libx11-6
  - libxcb1
  - libxcomposite1
  - libxdamage1
  - libxext6
  - libxfixes3
  - libxkbcommon0
  - libxrandr2
  - xdg-utils

# Backups
zabbix_backup_enabled: true
zabbix_backup_mount_point: /var/backups
zabbix_backup_dir: "{{ zabbix_backup_mount_point }}/zabbix-data"
zabbix_backup_keep_archived: 6
zabbix_backup_keep_max: 7
zabbix_backup_schedule_hour: 2
zabbix_backup_schedule_minute: 15
zabbix_backup_require_mount: false
zabbix_backup_script_path: /usr/local/bin/zabbix-db-backup.sh
zabbix_backup_log_path: /var/log/zabbix-db-backup.log
zabbix_backup_log_rotate_count: 12

# Platform matrix aligned with Zabbix official package instructions (7.0)
zabbix_platform_matrix:
  Ubuntu:
    supported_major: "24"
    repo_package_url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+ubuntu24.04_all.deb"
    repo_package_file: "/tmp/zabbix-release_latest_{{ zabbix_version }}+ubuntu24.04_all.deb"
    server_packages:
      - zabbix-server-pgsql
      - zabbix-frontend-php
      - php8.3-pgsql
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - zabbix-agent2
    plugin_packages:
      - zabbix-agent2-plugin-mongodb
      - zabbix-agent2-plugin-mssql
      - zabbix-agent2-plugin-postgresql
    postgresql_packages:
      - postgresql
      - postgresql-client
      - postgresql-contrib
    postgresql_client_packages:
      - postgresql-client
    postgresql_service: postgresql
    http_services:
      - apache2
    apache_conf_path: /etc/zabbix/apache.conf
    web_group: www-data
    web_config_path: /etc/zabbix/web/zabbix.conf.php

  OracleLinux:
    supported_major: "9"
    repo_rpm_url: "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/oracle/9/x86_64/zabbix-release-latest-{{ zabbix_version }}.el9.noarch.rpm"
    server_packages:
      - zabbix-server-pgsql
      - zabbix-web-pgsql
      - zabbix-apache-conf
      - zabbix-sql-scripts
      - zabbix-selinux-policy
      - zabbix-agent2
    plugin_packages:
      - zabbix-agent2-plugin-mongodb
      - zabbix-agent2-plugin-mssql
      - zabbix-agent2-plugin-postgresql
    postgresql_packages:
      - postgresql-server
      - postgresql
    postgresql_client_packages:
      - postgresql
    postgresql_service: postgresql
    postgresql_initdb_check: /var/lib/pgsql/data/PG_VERSION
    postgresql_initdb_command: postgresql-setup --initdb
    http_services:
      - httpd
      - php-fpm
    apache_conf_path: /etc/httpd/conf.d/zabbix.conf
    web_group: apache
    web_config_path: /etc/zabbix/web/zabbix.conf.php

# Auto-discovery defaults
zabbix_api_user: "Admin"
zabbix_api_password: ""
zabbix_api_bootstrap_password: "zabbix"
zabbix_discovery_rule_name: "{{ cluster_environment | default('managed') | title }} VM Auto-Discovery"
zabbix_discovery_rule_delay: "60s"
zabbix_discovery_action_name: "Auto-Discover {{ cluster_environment | default('managed') | title }} VMs Action"
zabbix_discovery_action_esc_period: "1h"
zabbix_discovery_excluded_groups: []
zabbix_discovery_host_groups:
  - "Linux servers"
zabbix_discovery_templates:
  - "Linux by Zabbix agent"

# Terraform inventory is authoritative. Network discovery remains an enabled
# fallback for unmanaged recovery scenarios, but exact host state is reconciled
# below through the API.
zabbix_inventory_reconciliation_enabled: true
zabbix_inventory_managed_tag: iac_managed
zabbix_inventory_managed_value: "true"
zabbix_inventory_retention_days: 30
monitoring_central_expected_environments:
  - "{{ cluster_environment | default('managed') }}"
monitoring_central_require_authoritative_inventory: true
zabbix_inventory_expected_down_maintenance_name: "IaC expected-down inventory policy"
zabbix_web_monitoring_enabled: true
zabbix_web_retire_absent_enabled: true
zabbix_web_scenario_delay: 30s
zabbix_web_scenario_timeout: 10s
# Page only after a sustained outage; keep this separate from probe cadence so
# operators can tune alert sensitivity without changing endpoint polling.
zabbix_web_outage_threshold: 1m
zabbix_service_monitoring_enabled: true
zabbix_service_slo: "99.5"
zabbix_service_sla_period: "1"
zabbix_service_sla_timezone: "Africa/Nairobi"
zabbix_web_endpoint_definitions:
  - group: zabbix_servers
    service: zabbix
    scheme: http
    port: 80
    path: /zabbix/
    status_codes: "200"
    verify_tls: true
  - group: observability_servers
    service: grafana
    scheme: http
    port: 3000
    path: /api/health
    status_codes: "200"
    verify_tls: true
  - group: observability_servers
    service: prometheus
    scheme: http
    port: 9090
    path: /-/ready
    status_codes: "200"
    verify_tls: true
  - group: observability_servers
    service: loki
    scheme: http
    port: 3100
    path: /ready
    status_codes: "200"
    verify_tls: true
  - group: jenkins_servers
    service: jenkins
    scheme: http
    port: 8080
    path: /login
    status_codes: "200"
    verify_tls: true
  - group: gitlab_servers
    service: gitlab
    scheme: http
    port: 80
    path: /users/sign_in
    status_codes: "200"
    verify_tls: true
  - group: keycloak_servers
    service: keycloak
    scheme: http
    port: 8080
    path: /
    status_codes: "200,302"
    verify_tls: true
  - group: freeipa_servers
    service: freeipa
    scheme: https
    port: 443
    path: /ipa/ui/
    status_codes: "200"
    verify_tls: false
  - group: zimbra_servers
    service: zimbra-web
    scheme: https
    port: 443
    path: /
    status_codes: "200,302"
    verify_tls: false
  - group: k8s_control_plane
    service: kubernetes-api
    scheme: https
    port: 6443
    path: /livez
    status_codes: "200"
    verify_tls: false
# Bump this non-secret marker whenever the encrypted WebLogic monitoring
# password changes. Zabbix intentionally never returns a secret macro value,
# so the marker is the safe change detector used by exact reconciliation.
monitoring_weblogic_secret_version: "1"
zabbix_inventory_profile_templates:
  default:
    - Linux by Zabbix agent active
  database19c:
    - Linux by Zabbix agent active
  database19c_ol9:
    - Linux by Zabbix agent active
  database21c:
    - Linux by Zabbix agent active
  weblogic12c:
    - Linux by Zabbix agent active
    - IaC WebLogic JVM LLD
  weblogic14c:
    - Linux by Zabbix agent active
    - IaC WebLogic JVM LLD
zabbix_inventory_custom_templates:
  - iac-oracle-license-safe.yaml
  - iac-weblogic-jvm.yaml

# Optional email alert path. Recipient usernames must already have media access
# appropriate for the configured media type.
zabbix_email_alerts_enabled: false
zabbix_email_media_type_name: "IaC SMTP"
zabbix_email_smtp_server: ""
zabbix_email_smtp_port: 587
zabbix_email_smtp_helo: "localhost"
zabbix_email_from: ""
zabbix_email_security: "STARTTLS"
zabbix_email_verify_peer: true
zabbix_email_verify_host: true
zabbix_email_smtp_authentication: true
zabbix_email_smtp_username: ""
zabbix_email_smtp_password: ""
zabbix_email_recipient_users: []
zabbix_email_recipient_address: ""
zabbix_email_test_recipient: "{{ zabbix_email_recipient_address }}"
zabbix_email_min_severity: "warning"
zabbix_email_action_name: "Email managed infrastructure problems"
# Alertmanager owns production paging by default. Zabbix keeps media and
# reporting available, but its broad trigger action stays disabled to avoid
# duplicate messages for the same host/service outage.
zabbix_email_trigger_notifications_enabled: false
monitoring_send_test_alerts: false
monitoring_test_alerts_confirm: ""
