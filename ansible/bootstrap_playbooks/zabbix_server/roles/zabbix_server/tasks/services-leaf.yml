---
- name: Query one IaC Zabbix service leaf
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: service.get
      params:
        output:
          - serviceid
          - name
        filter:
          name:
            - "{{ zabbix_service_leaf.name }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_service_leaf_lookup
  changed_when: false
  failed_when: >-
    zabbix_service_leaf_lookup.json.error is defined or
    zabbix_service_leaf_lookup.json.result | length > 1

- name: Build one IaC Zabbix service leaf definition
  ansible.builtin.set_fact:
    zabbix_service_leaf_definition:
      name: "{{ zabbix_service_leaf.name }}"
      algorithm: "1"
      sortorder: "0"
      parents:
        - serviceid: "{{ zabbix_service_root_ids[zabbix_service_leaf.environment] }}"
      problem_tags:
        - tag: service_id
          operator: "0"
          value: "{{ zabbix_service_leaf.service_id }}"
      tags:
        - tag: iac_managed
          value: "true"
        - tag: environment
          value: "{{ zabbix_service_leaf.environment }}"
        - tag: expected_up
          value: "{{ zabbix_service_leaf.expected_up | bool | ternary('true', 'false') }}"
        - tag: sla_scope
          value: >-
            {{ zabbix_service_leaf.environment }}-{{
               zabbix_service_leaf.expected_up | bool
               | ternary('expected', 'not-expected') }}
        - tag: category
          value: "{{ zabbix_service_leaf.category }}"

- name: Create missing IaC Zabbix service leaf
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: service.create
      params: "{{ zabbix_service_leaf_definition }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_service_leaf_create
  when: zabbix_service_leaf_lookup.json.result | length == 0
  changed_when: true
  failed_when: zabbix_service_leaf_create.json.error is defined

- name: Update IaC Zabbix service leaf
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: service.update
      params: >-
        {{ zabbix_service_leaf_definition
           | combine({'serviceid': zabbix_service_leaf_lookup.json.result[0].serviceid}) }}
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_service_leaf_update
  when: zabbix_service_leaf_lookup.json.result | length == 1
  changed_when: false
  failed_when: zabbix_service_leaf_update.json.error is defined
