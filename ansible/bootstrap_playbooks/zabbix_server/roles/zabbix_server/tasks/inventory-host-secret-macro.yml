---
- name: Resolve exact Zabbix host ID for secret macro
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: host.get
      params:
        output:
          - hostid
        filter:
          host:
            - "{{ zabbix_inventory_host.host_name }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_inventory_secret_macro_host
  changed_when: false
  failed_when: >-
    zabbix_inventory_secret_macro_host.json.error is defined or
    zabbix_inventory_secret_macro_host.json.result | length != 1
  no_log: true

- name: Query existing Zabbix secret host macro
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: usermacro.get
      params:
        output:
          - hostmacroid
          - macro
          - value
          - type
          - description
        hostids:
          - "{{ zabbix_inventory_secret_macro_host.json.result[0].hostid }}"
        filter:
          macro:
            - "{{ zabbix_inventory_secret_macro.macro }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_inventory_secret_macro_existing
  changed_when: false
  failed_when: zabbix_inventory_secret_macro_existing.json.error is defined
  no_log: true

- name: Create missing Zabbix secret host macro
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: usermacro.create
      params:
        hostid: "{{ zabbix_inventory_secret_macro_host.json.result[0].hostid }}"
        macro: "{{ zabbix_inventory_secret_macro.macro }}"
        value: "{{ zabbix_inventory_secret_macro.value }}"
        type: "{{ zabbix_inventory_secret_macro.type | default(0) | int }}"
        description: "{{ zabbix_inventory_secret_macro.description | default('') }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_inventory_secret_macro_create
  when: zabbix_inventory_secret_macro_existing.json.result | length == 0
  changed_when: true
  failed_when: zabbix_inventory_secret_macro_create.json.error is defined
  no_log: true

- name: Reconcile existing Zabbix secret host macro
  ansible.builtin.uri:
    url: http://127.0.0.1/zabbix/api_jsonrpc.php
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      method: usermacro.update
      params:
        hostmacroid: "{{ zabbix_inventory_secret_macro_existing.json.result[0].hostmacroid }}"
        value: "{{ zabbix_inventory_secret_macro.value }}"
        type: "{{ zabbix_inventory_secret_macro.type | default(0) | int }}"
        description: "{{ zabbix_inventory_secret_macro.description | default('') }}"
      auth: "{{ zabbix_reconciled_login.json.result }}"
      id: 1
    status_code: 200
  register: zabbix_inventory_secret_macro_update
  when:
    - zabbix_inventory_secret_macro_existing.json.result | length == 1
    - >-
      (zabbix_inventory_secret_macro_existing.json.result[0].type | int !=
       zabbix_inventory_secret_macro.type | default(0) | int) or
      (zabbix_inventory_secret_macro_existing.json.result[0].description | default('') !=
       zabbix_inventory_secret_macro.description | default('')) or
      ((zabbix_inventory_secret_macro.type | default(0) | int == 0) and
       (zabbix_inventory_secret_macro_existing.json.result[0].value | default('') !=
        zabbix_inventory_secret_macro.value))
  changed_when: true
  failed_when: zabbix_inventory_secret_macro_update.json.error is defined
  no_log: true
