---
- name: Gather service facts for firewalld detection
  ansible.builtin.service_facts:

- name: Open HTTP service in firewalld
  when:
    - "'firewalld.service' in ansible_facts.services"
    - ansible_facts.services['firewalld.service'].state == 'running'
  block:
    - name: Check existing firewalld HTTP rule
      ansible.builtin.command: firewall-cmd --permanent --query-service=http
      register: zabbix_firewalld_http_query
      changed_when: false
      failed_when: false

    - name: Add firewalld HTTP rule
      ansible.builtin.command: firewall-cmd --permanent --add-service=http
      register: zabbix_firewalld_add_http
      changed_when: zabbix_firewalld_add_http.rc == 0
      when: zabbix_firewalld_http_query.rc != 0

    - name: Check existing firewalld Zabbix server rule
      ansible.builtin.command: firewall-cmd --permanent --query-port={{ zabbix_server_port }}/tcp
      register: zabbix_firewalld_10051_query
      changed_when: false
      failed_when: false

    - name: Add firewalld Zabbix server rule
      ansible.builtin.command: firewall-cmd --permanent --add-port={{ zabbix_server_port }}/tcp
      register: zabbix_firewalld_add_10051
      changed_when: zabbix_firewalld_add_10051.rc == 0
      when: zabbix_firewalld_10051_query.rc != 0

    - name: Check temporary broad firewalld Zabbix agent rule
      ansible.builtin.command: firewall-cmd --permanent --query-port={{ zabbix_agent_port }}/tcp
      register: zabbix_firewalld_10050_query
      changed_when: false
      failed_when: false

    - name: Remove temporary broad firewalld Zabbix agent rule
      ansible.builtin.command: firewall-cmd --permanent --remove-port={{ zabbix_agent_port }}/tcp
      register: zabbix_firewalld_remove_10050
      changed_when: zabbix_firewalld_remove_10050.rc == 0
      when: zabbix_firewalld_10050_query.rc == 0

    - name: Allow firewalld Zabbix agent only from the Zabbix server
      ansible.posix.firewalld:
        rich_rule: >-
          rule family="ipv4" source address="{{ zabbix_agent_source_cidr }}"
          port port="{{ zabbix_agent_port }}" protocol="tcp" accept
        permanent: true
        immediate: true
        state: enabled

    - name: Reload firewalld
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true
      when: >-
        (zabbix_firewalld_add_http is defined and zabbix_firewalld_add_http.changed) or
        (zabbix_firewalld_add_10051 is defined and zabbix_firewalld_add_10051.changed) or
        (zabbix_firewalld_remove_10050 is defined and zabbix_firewalld_remove_10050.changed)

- name: Check if ufw is available
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: zabbix_ufw_present

- name: Open HTTP in ufw
  community.general.ufw:
    rule: allow
    from_ip: "{{ zabbix_allow_http_cidr }}"
    to_port: "80"
    proto: tcp
  when: zabbix_ufw_present.stat.exists

- name: Open Zabbix server port in ufw
  community.general.ufw:
    rule: allow
    from_ip: "{{ zabbix_allow_server_port_cidr }}"
    to_port: "{{ zabbix_server_port | string }}"
    proto: tcp
  when: zabbix_ufw_present.stat.exists

- name: Remove legacy unqualified Zabbix agent rule from ufw
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - delete
      - allow
      - "{{ zabbix_agent_port | string }}/tcp"
  register: zabbix_ufw_legacy_unqualified_agent_rule
  changed_when: >-
    zabbix_ufw_legacy_unqualified_agent_rule.rc == 0 and
    ('Rule deleted' in
     (zabbix_ufw_legacy_unqualified_agent_rule.stdout | default('')) or
     'Rules updated' in
     (zabbix_ufw_legacy_unqualified_agent_rule.stdout | default('')))
  failed_when: false
  when: zabbix_ufw_present.stat.exists

- name: Remove legacy broad Zabbix agent rule from ufw
  ansible.builtin.command:
    argv:
      - ufw
      - --force
      - delete
      - allow
      - from
      - "{{ zabbix_allow_server_port_cidr }}"
      - to
      - any
      - port
      - "{{ zabbix_agent_port | string }}"
      - proto
      - tcp
  register: zabbix_ufw_legacy_agent_rule
  changed_when: >-
    zabbix_ufw_legacy_agent_rule.rc == 0 and
    ('Rule deleted' in (zabbix_ufw_legacy_agent_rule.stdout | default('')) or
     'Rules updated' in (zabbix_ufw_legacy_agent_rule.stdout | default('')))
  failed_when: false
  when:
    - zabbix_ufw_present.stat.exists
    - zabbix_allow_server_port_cidr != zabbix_agent_source_cidr

- name: Open Zabbix agent port in ufw
  community.general.ufw:
    rule: allow
    from_ip: "{{ zabbix_agent_source_cidr }}"
    to_port: "{{ zabbix_agent_port | string }}"
    proto: tcp
  when: zabbix_ufw_present.stat.exists

- name: Preserve OpenSSH access before enabling ufw
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: zabbix_ufw_present.stat.exists

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: zabbix_ufw_present.stat.exists
